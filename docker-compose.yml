# Local development database for ai-agent-core.
#
#   docker compose up -d
#
# Brings up PostgreSQL 16 with the pgvector extension and creates the two
# databases the app needs: `ai-agent` (main store) and `agentstore` (AI store +
# Spring AI pgvector table). Liquibase changelogs run on app boot and create the
# schema; pgvector is enabled in agentstore by the init script.
#
# Host port 5432 (standard). Note: host port 5555 collides with a local
# SoftEther vpnserver on this machine, so we map to 5432 instead. The app's
# datasource URLs in application.properties point at localhost:5432.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai-agent-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ai-agent-pgdata:
