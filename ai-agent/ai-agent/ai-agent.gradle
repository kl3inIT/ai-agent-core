archivesBaseName = 'ai-agent'

dependencies {
    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'io.jmix.security:jmix-security-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'

    implementation 'org.springframework.ai:spring-ai-client-chat:1.1.4'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-web'

    // FoundationsBootSmokeTest (plan 02-10) references the add-on's
    // auto-configuration classes (AIAutoConfiguration, SpiDefaultsAutoConfiguration)
    // directly via @ImportAutoConfiguration. Those classes live in the sibling
    // ai-agent-starter module, so pull it onto the TEST classpath only. This is
    // test-scoped and does NOT create a production-cycle: ai-agent-starter's
    // `api project(':ai-agent')` continues to be the single compile-time direction.
    testImplementation project(':ai-agent-starter')

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.hsqldb:hsqldb'
}

configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
    exclude group: 'com.vaadin', module: 'copilot'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live'
    }
}

tasks.register('liveTest', Test) {
    description = 'Run @Tag("live") integration tests (require OPENROUTER_API_KEY).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'live'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
}
