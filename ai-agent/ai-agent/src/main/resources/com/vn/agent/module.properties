jmix.ui.menu-config=com/vn/agent/menu.xml
jmix.core.available-locales=en

# Single source of truth: every jmix.ai-agent.* default lives in its
# @ConfigurationProperties resolved*()/is*() accessor. Only NON-default overrides,
# framework keys, and third-party (spring.ai.*) keys are set here.

# --- RAG ingestion (Phase 05-03 / D-13) ---
# chunk-size pins Spring AI TokenTextSplitter's default (guards against upstream drift);
# min-chunk-size-chars overrides Spring AI's 350 default. chunk-overlap is intentionally
# absent — TokenTextSplitter has no overlapping-window knob (RESEARCH Pitfall #5).
jmix.ai-agent.rag.splitter.chunk-size=800
jmix.ai-agent.rag.splitter.min-chunk-size-chars=40

# Conversation title generation (Phase 12-05 / D-15): every knob defaults in code
# (AiAgentTitleProperties.resolved*()). Set a jmix.ai-agent.conversation-title.* key
# here only to OVERRIDE a default.

# --- Spring AI retry (D-16) — third-party surface; this module owns no
# @ConfigurationProperties for it, so the overrides must live here. ---
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2s
# SpringAiRetryProperties.Backoff.multiplier is an int in 1.1.x (not a double),
# so decimal values would fail binding — use an integer multiplier.
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30s
spring.ai.retry.on-client-errors=false

# Phase 16 D-06 curated multi-vendor model catalog. Data (no code default): the addon
# mixes Qwen (offline self-host) + Claude (online via OpenRouter); the host app's
# deployment gates reachability. Marked-default entry MUST match
# default-params.yaml.model (TEST-20 drift gate).
jmix.ai-agent.models.catalog[0].id=qwen/qwen3.6-35b-a3b
jmix.ai-agent.models.catalog[0].label-message-key=chatModelCatalog.qwen3_35b
jmix.ai-agent.models.catalog[0].is-default=true
jmix.ai-agent.models.catalog[1].id=qwen/qwen3-32b
jmix.ai-agent.models.catalog[1].label-message-key=chatModelCatalog.qwen3_32b
jmix.ai-agent.models.catalog[1].is-default=false
jmix.ai-agent.models.catalog[2].id=anthropic/claude-sonnet-4-6
jmix.ai-agent.models.catalog[2].label-message-key=chatModelCatalog.claude_sonnet_4_6
jmix.ai-agent.models.catalog[2].is-default=false
jmix.ai-agent.models.catalog[3].id=anthropic/claude-opus-4-7
jmix.ai-agent.models.catalog[3].label-message-key=chatModelCatalog.claude_opus_4_7
jmix.ai-agent.models.catalog[3].is-default=false
