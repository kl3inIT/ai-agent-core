jmix.ui.menu-config=com/vn/agent/menu.xml
jmix.core.available-locales=en

# Maximum depth for attribute paths in the AI structured filter (TOOL-05, D-08).
# Each hop is also AccessManager-checked; this cap bounds cost and blast radius.
jmix.ai-agent.tools.max-filter-depth = 3

# --- RAG ingestion (Phase 05-03 / D-12 / D-13 / D-17) ---
# TokenTextSplitter sizing (chunk-overlap is a semantic alias — TokenTextSplitter
# does not produce overlapping windows; min-chunk-size-chars is the honest knob,
# RESEARCH Pitfall #5).
jmix.ai-agent.rag.splitter.chunk-size=800
jmix.ai-agent.rag.splitter.chunk-overlap=120
jmix.ai-agent.rag.splitter.min-chunk-size-chars=40

# Bounded aiAgentIngestExecutor sizing (D-12). CallerRunsPolicy back-pressure is
# wired in AIConfiguration and is not configurable.
jmix.ai-agent.rag.ingest-executor.core-pool-size=2
jmix.ai-agent.rag.ingest-executor.max-pool-size=4
jmix.ai-agent.rag.ingest-executor.queue-capacity=64
jmix.ai-agent.rag.ingest-executor.keep-alive-seconds=60

# --- Conversation title generation (Phase 12-05 / D-15) ---
jmix.ai-agent.conversation-title.enabled=true
jmix.ai-agent.conversation-title.max-context-messages=6
jmix.ai-agent.conversation-title.min-assistant-messages-trigger=1
jmix.ai-agent.conversation-title.executor.core-pool-size=1
jmix.ai-agent.conversation-title.executor.max-pool-size=2
jmix.ai-agent.conversation-title.executor.queue-capacity=32
jmix.ai-agent.conversation-title.executor.keep-alive-seconds=60

# Flow UI per-file upload cap. Host apps should keep
# spring.servlet.multipart.max-file-size / max-request-size at or above this value.
jmix.ai-agent.rag.upload.max-file-size-bytes=104857600

# Classpath-markdown reference ingester stays OFF by default (D-17).
jmix.ai-agent.rag.sample-ingester.enabled=false


# --- Spring AI retry (D-16 / RESEARCH override) ---
# Applies to EmbeddingModel calls (and other spring-ai provider calls) via the
# spring-ai-autoconfigure-retry module. Intentionally using built-in
# spring.ai.retry.* surface — NO spring-retry @Retryable dep in this module.
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2s
# SpringAiRetryProperties.Backoff.multiplier is an int in 1.1.4 (not a double),
# so decimal values would fail binding — use integer multiplier.
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30s
spring.ai.retry.on-client-errors=false

# AUD-07 plumbing (Phase 9 D-18): pre/post-image PII hashing for mutation rows.
# Phase 11 (MutationErrorTranslator) is the future consumer; in Phase 9 v1.1 these
# keys are advertised but no caller reads them yet.
jmix.ai-agent.audit.hash-sensitive-fields=true
jmix.ai-agent.audit.sensitive-fields=

# D-03: max entities rendered into agent.entities / agent.permissions before truncation.
# Aligns with TOOL-06 find_records max=100 cap.
jmix.ai-agent.prompt.entity-inventory.limit=100

# PROMPT-06 / D-08: host-prefix-leak and tool-name-leak both default ON.
# Operators opt out per-pack without disabling the parent scanner block. Output scanner is
# flag-and-pass-through (audit-only) — disabling these merely silences the FLAGGED audit row.
jmix.ai-agent.guard.output-scanner.host-prefix-leak.enabled=true
jmix.ai-agent.guard.output-scanner.tool-name-leak.enabled=true

# Phase 16 D-06 curated multi-vendor model catalog. The addon supports both
# offline-only (Qwen self-host) and online (Claude via OpenRouter) host-app
# deployments. The host app's deployment determines reachability at runtime.
# Marked-default entry MUST match default-params.yaml.model (TEST-20 drift gate).
jmix.ai-agent.models.catalog[0].id=qwen/qwen3.6-35b-a3b
jmix.ai-agent.models.catalog[0].label-message-key=chatModelCatalog.qwen3_35b
jmix.ai-agent.models.catalog[0].is-default=true
jmix.ai-agent.models.catalog[1].id=qwen/qwen3-32b
jmix.ai-agent.models.catalog[1].label-message-key=chatModelCatalog.qwen3_32b
jmix.ai-agent.models.catalog[1].is-default=false
jmix.ai-agent.models.catalog[2].id=anthropic/claude-sonnet-4-6
jmix.ai-agent.models.catalog[2].label-message-key=chatModelCatalog.claude_sonnet_4_6
jmix.ai-agent.models.catalog[2].is-default=false
jmix.ai-agent.models.catalog[3].id=anthropic/claude-opus-4-7
jmix.ai-agent.models.catalog[3].label-message-key=chatModelCatalog.claude_opus_4_7
jmix.ai-agent.models.catalog[3].is-default=false
