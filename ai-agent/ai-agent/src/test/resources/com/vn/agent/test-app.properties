main.liquibase.change-log=com/vn/agent/liquibase/agentstore-changelog.xml
agentstore.liquibase.change-log=com/vn/agent/liquibase/agentstore-changelog.xml

# Phase 7.2 Wave 5 (Rule 3 - Blocker): test wiring must register the `agentstore` additional
# store and point its datasource at the embedded HSQLDB so @SpringBootTest can bootstrap
# AgentstoreStoreConfiguration (which declares agentstoreDataSource + agentstoreLiquibase).
# AITestConfiguration provides the @Primary main DataSource; the agentstore datasource
# below uses the same in-memory URL via HSQLDB's shared-memory mode so both stores see the
# same schema (Liquibase applies the agentstore changelog via agentstoreLiquibase).
jmix.core.additional-stores=agentstore
agentstore.datasource.url=jdbc:hsqldb:mem:agentstore-${random.uuid}
agentstore.datasource.username=sa
agentstore.datasource.password=
agentstore.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver

# Spring AI JDBC chat memory auto-init creates SPRING_AI_CHAT_MEMORY against HSQL (the add-on's
# 060-ai-chat-memory.xml liquibase is postgres-only). Under test, let Spring AI initialize the
# schema itself against the in-memory HSQL agentstore datasource.
spring.ai.chat.memory.repository.jdbc.initialize-schema=embedded
spring.ai.chat.memory.repository.jdbc.schema=classpath:org/springframework/ai/chat/memory/repository/jdbc/schema-hsqldb.sql

# Disable the DefaultParamsSeeder ApplicationReadyEvent listener in tests.
# Production behaviour (matchIfMissing=true) keeps seeding on first boot; tests that
# need the "default" AiParameters row can call the seeder directly or seed via
# DataManager in @BeforeEach. Rationale: running ad-hoc JPQL inside a test
# ApplicationReadyEvent hook fires before every @SpringBootTest's assertions and
# fails in HSQL test contexts where the JPA metamodel + test-harness DataManager
# wiring diverge slightly from the bootRun runtime (surfaced in plan 07-07b after
# the login-view / security-filter fixes let the context reach ReadyEvent).
jmix.ai-agent.parameters.seed-default=false

# Phase 4 (D-04): defaults consumed by AiParametersResolver fallback.
# Required by any @SpringBootTest that wires ChatClientFactory -> AiParametersResolver.
jmix.ai-agent.defaults.model=stub/model
jmix.ai-agent.defaults.temperature=0.2
jmix.ai-agent.defaults.top-p=1.0
jmix.ai-agent.defaults.max-tokens=1500
jmix.ai-agent.defaults.system-prompt=You are a test assistant.

# OpenRouter live-test wiring (consumed by ChatServiceLiveTest).
# Default ./gradlew :ai-agent:test excludes @Tag("live") so these are inert for CI.
# For manual ./gradlew :ai-agent:liveTest runs, set OPENROUTER_API_KEY in env;
# if unset, @EnabledIfEnvironmentVariable skips the test before these props are used.
spring.ai.openai.api-key=${OPENROUTER_API_KEY:none}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}