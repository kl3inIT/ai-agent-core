# Build performance baseline. Composite builds do NOT inherit these from the root —
# the same flags must appear in every includedBuild's own gradle.properties
# (ai-agent/gradle.properties, dth-crm/gradle.properties). Pattern mirrors
# jmix-insurance's gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
