# ===== server =====
server.port=8088

# ===== spring =====
spring.profiles.active=local
spring.main.allow-bean-definition-overriding=true
# Only secret loaded from the project-root .env is OPENROUTER_API_KEY. Everything
# else below is pinned directly (no env-var indirection / no ${ENV:default}).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===== databases — one pgvector container (docker-compose.yml), two DBs on 5433 =====
# main store -> dthcrm db; ai-agent add-on store -> agentstore db (pgvector). Both
# live in the SAME pgvector container (pgvector/pgvector:pg18). Bring it up with
# `docker compose up -d` from the repo root. Creds match docker-compose.yml.
main.datasource.url=jdbc:postgresql://localhost:5433/dthcrm
main.datasource.username=postgres
main.datasource.password=admin123
main.liquibase.change-log=com/company/crm/liquibase/changelog.xml

jmix.core.additional-stores=agentstore
agentstore.datasource.url=jdbc:postgresql://localhost:5433/agentstore
agentstore.datasource.username=postgres
agentstore.datasource.password=admin123
agentstore.liquibase.change-log=com/vn/agent/liquibase/agentstore-changelog.xml
agentstore.datasource.studio.liquibase.exclude-prefixes=spring_ai_,ai_agent_kb_vector_store

# Schema init flags for add-on managed tables
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
spring.ai.vectorstore.pgvector.initialize-schema=true

# ===== Spring AI via OpenRouter (api-key is the ONLY value taken from .env) =====
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=anthropic/claude-sonnet-4-6
spring.ai.openai.embedding.options.model=qwen/qwen3-embedding-4b
spring.ai.openai.embedding.options.dimensions=2000
spring.ai.vectorstore.pgvector.table-name=AI_AGENT_KB_VECTOR_STORE
spring.ai.vectorstore.pgvector.dimensions=2000
spring.ai.vectorstore.pgvector.index-type=HNSW

# ===== ai-agent add-on defaults =====
jmix.ai-agent.defaults.model=anthropic/claude-sonnet-4-6
jmix.ai-agent.defaults.temperature=0.2
jmix.ai-agent.defaults.top-p=1.0
jmix.ai-agent.defaults.max-tokens=2048
jmix.ai-agent.defaults.system-prompt=Bạn là trợ lý AI của hệ thống DTH CRM. Trả lời bằng tiếng Việt, ngắn gọn và rõ ràng. Chỉ sử dụng dữ liệu CRM mà người dùng được phép truy cập.
jmix.ai-agent.embedding.model=qwen/qwen3-embedding-4b
jmix.ai-agent.embedding.dimensions=2000

# Override the bundled catalog so claude-sonnet is the default-flagged entry
# (drift gate requires this == default-params.yaml.model).
jmix.ai-agent.models.catalog[0].id=anthropic/claude-sonnet-4-6
jmix.ai-agent.models.catalog[0].label-message-key=chatModelCatalog.claude_sonnet_4_6
jmix.ai-agent.models.catalog[0].is-default=true
jmix.ai-agent.models.catalog[1].id=anthropic/claude-opus-4-7
jmix.ai-agent.models.catalog[1].label-message-key=chatModelCatalog.claude_opus_4_7
jmix.ai-agent.models.catalog[1].is-default=false
jmix.ai-agent.models.catalog[2].id=qwen/qwen3.6-35b-a3b
jmix.ai-agent.models.catalog[2].label-message-key=chatModelCatalog.qwen3_35b
jmix.ai-agent.models.catalog[2].is-default=false
jmix.ai-agent.models.catalog[3].id=qwen/qwen3-32b
jmix.ai-agent.models.catalog[3].label-message-key=chatModelCatalog.qwen3_32b
jmix.ai-agent.models.catalog[3].is-default=false

# multipart caps for KB uploads. NOTE: jmix.ai-agent.rag.upload.max-file-size-bytes
# is NOT re-declared here — the add-on's module.properties already ships the same
# 100MB default, so repeating it was redundant.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
jmix.ai-agent.rag.upload.file-staging-root=${jmix.core.temp-dir}

# ===== jmix UI =====
jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/crm/menu.xml
jmix.ui.composite-menu=false
jmix.ui.default-view-id=HomeView
jmix.ui.component.checkbox-required-state-initialization-enabled=false
jmix.core.default-file-storage=crm
crm.generateDemoData=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

# tiếng Việt là locale mặc định (đầu danh sách)
jmix.core.available-locales=vi,en

# don't launch browser in dev
vaadin.launch-browser=false

# ===== logging =====
spring.output.ansi.enabled=always
logging.level.eclipselink.logging.sql=info
logging.level.io.jmix.core.datastore=info
logging.level.io.jmix.core.AccessLogger=debug
logging.level.io.jmix=info
logging.level.org.springframework.security=info
logging.level.org.atmosphere=warn
logging.level.org.springframework.ai=INFO
logging.level.com.vn.agent=INFO
