# Production profile overrides — activated via DTH_ACTIVE_PROFILE=prod or
# --spring.profiles.active=prod. Mounted by docker-compose.prod.yml.

# Datasource credentials MUST come from the deployment's secret manager / env in
# prod — never the literal local-dev values pinned in application.properties.
# No defaults: a missing secret fails fast rather than silently using a dev password.
main.datasource.url=${MAIN_DATASOURCE_URL}
main.datasource.username=${MAIN_DATASOURCE_USERNAME}
main.datasource.password=${MAIN_DATASOURCE_PASSWORD}
agentstore.datasource.url=${AGENTSTORE_DATASOURCE_URL}
agentstore.datasource.username=${AGENTSTORE_DATASOURCE_USERNAME}
agentstore.datasource.password=${AGENTSTORE_DATASOURCE_PASSWORD}

# Enable demo data seeding in production too. The generator is idempotent —
# it skips if the clients table is already populated, so existing prod data is safe.
crm.generateDemoData=true

# Larger DB connection pools for production traffic.
main.datasource.hikari.maximum-pool-size=20
main.datasource.hikari.minimum-idle=5
agentstore.datasource.hikari.maximum-pool-size=10
agentstore.datasource.hikari.minimum-idle=2

# Quieter logs.
logging.level.io.jmix=WARN
logging.level.io.jmix.core.AccessLogger=INFO
logging.level.eclipselink.logging.sql=WARN
logging.level.org.springframework.security=WARN

# Vaadin production mode — no dev bundle rebuild on first request.
vaadin.productionMode=true
vaadin.launch-browser=false

###############################################################################
# OBSERVABILITY — Spring AI + OpenTelemetry (best practice)
# Trace/metric/log do OTel Java agent (-javaagent, đặt trong Dockerfile) xuất OTLP
# về collector dùng chung (cấu hình OTEL_* trong docker-compose.prod.yml).
# Agent bắc cầu Micrometer ObservationRegistry -> các observation của Spring AI
# (ChatClient/ChatModel/Embedding/VectorStore) thành span gen_ai + metric token usage.
# spring-boot-starter-actuator (build.gradle) cung cấp ObservationRegistry.
###############################################################################
# Lấy mẫu 100% observation (để agent tạo span cho mọi lần gọi AI).
management.tracing.sampling.probability=1.0
# Ghi nội dung prompt/completion/tool-call/vector-query của Spring AI.
# LƯU Ý (theo docs Spring AI 1.1.x): các property cũ include-prompt / include-completion /
# include-input / include-query-response đã bị ĐỔI TÊN từ 1.0.0-RC1 -> log-* và nay BỊ BỎ QUA.
# Khác biệt hành vi: nội dung giờ phát ra dưới dạng LOG EVENT (không còn nhồi vào span như xưa);
# OTel logback appender đẩy log này sang Loki, tự gắn trace_id để Loki <-> Tempo nhảy qua lại.
# CHÚ Ý: log sẽ chứa nội dung hội thoại — chỉ bật ở môi trường nội bộ.
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.chat.observations.include-error-logging=true
spring.ai.tools.observations.include-content=true
spring.ai.vectorstore.observations.log-query-response=true
# Gắn trace_id/span_id vào log (MDC) để Loki <-> Tempo nhảy qua lại.
logging.pattern.level=%5p [${spring.application.name:dth-crm},%X{trace_id:-},%X{span_id:-}]
