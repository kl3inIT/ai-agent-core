# Local development profile — overrides the datasource URLs to point at the
# docker-compose Postgres (docker-compose.yml at the repo root, host port 5433).
#
# Usage (IntelliJ): set env var SPRING_PROFILES_ACTIVE=local on the run config.
# Usage (CLI):      ./gradlew bootRun --args='--spring.profiles.active=local'
#
# Host port is 5433 (5432 = another local docker Postgres; 5555 = local SoftEther
# vpnserver, which RSTs the handshake). Everything else (Liquibase changelogs,
# Spring AI pgvector init, credentials) is inherited from application.properties
# — only the URLs change here.

main.datasource.url=jdbc:postgresql://localhost:5433/ai-agent
agentstore.datasource.url=jdbc:postgresql://localhost:5433/agentstore
