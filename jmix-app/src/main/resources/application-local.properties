# Local development profile — overrides the datasource URLs to point at the
# docker-compose Postgres (docker-compose.yml at the repo root).
#
# Usage:
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# Host port is 5432 (the standard Postgres port); 5555 is avoided because a
# local SoftEther vpnserver may already hold it. Everything else (Liquibase
# changelogs, Spring AI pgvector init, etc.) is inherited from
# application.properties — only the URLs change here.

main.datasource.url=jdbc:postgresql://localhost:5432/ai-agent
agentstore.datasource.url=jdbc:postgresql://localhost:5432/agentstore
