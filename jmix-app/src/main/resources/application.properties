main.datasource.url=jdbc:postgresql://10.123.123.174:5555/ai-agent
main.datasource.username=postgres
main.datasource.password=admin123

# Load local .env for developer secrets (e.g. OPENROUTER_API_KEY).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

main.liquibase.change-log=com/vn/jmixapp/liquibase/changelog.xml

# Activate the HSQLDB fallback profile with:
# ./gradlew bootRun --args='--spring.profiles.active=hsqldb'

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/vn/jmixapp/menu.xml
jmix.ui.composite-menu=false

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=vi,en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

# ===== Spring AI schema ownership =====
# Spring AI's default JDBC chat-memory initializer targets the primary datasource.
# Keep it off; the ai-agent starter runs Spring AI's own schema script on agentstore.
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
# PgVectorStore creates its own table/index through the ai-agent VectorStore bean.
spring.ai.vectorstore.pgvector.initialize-schema=true

# ===== Phase 4 (D-04): defaults consumed by AiParametersResolver fallback =====
jmix.ai-agent.defaults.model=openai/gpt-4o-mini
jmix.ai-agent.defaults.temperature=0.2
jmix.ai-agent.defaults.top-p=1.0
jmix.ai-agent.defaults.max-tokens=1500
jmix.ai-agent.defaults.system-prompt=You are a Jmix assistant. Answer using only authorized Jmix data and retrieved knowledge-base documents the user is allowed to access.

# ===== Phase 4 (ORCH-06): OpenRouter base-url override (Phase 1 pinned api-key in env OPENROUTER_API_KEY) =====
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.options.model=openai/gpt-4o-mini
spring.ai.openai.embedding.options.model=qwen/qwen3-embedding-4b
spring.ai.openai.embedding.options.dimensions=2000
spring.ai.vectorstore.pgvector.table-name=AI_AGENT_KB_VECTOR_STORE
spring.ai.vectorstore.pgvector.dimensions=2000
spring.ai.vectorstore.pgvector.index-type=HNSW
jmix.ai-agent.embedding.model=qwen/qwen3-embedding-4b
jmix.ai-agent.embedding.dimensions=2000
agentstore.datasource.url=jdbc:postgresql://10.123.123.174:5555/agentstore
agentstore.datasource.username=postgres
agentstore.datasource.password=admin123
jmix.core.additional-stores=agentstore
agentstore.liquibase.change-log=com/vn/jmixapp/liquibase/agentstore-changelog.xml
# Tables managed outside the Jmix entity model (Spring AI chat memory + pgvector store).
# Without this, Jmix Studio's "Generate Changelog" emits a <dropTable> for them on every diff.
# Keep the servlet multipart ceiling above the Flow UI upload cap so larger PDFs are not rejected.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
jmix.ai-agent.rag.upload.max-file-size-bytes=104857600
jmix.ai-agent.rag.upload.file-staging-root=${jmix.core.temp-dir}
agentstore.datasource.studio.liquibase.exclude-prefixes=spring_ai_,ai_agent_kb_vector_store
