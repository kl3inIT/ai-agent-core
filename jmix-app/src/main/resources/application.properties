main.datasource.url=jdbc:postgresql://10.123.123.174:5555/ai-agent
main.datasource.username=postgres
main.datasource.password=admin123

main.liquibase.change-log=com/vn/jmixapp/liquibase/changelog.xml

# Activate the HSQLDB fallback profile with:
# ./gradlew bootRun --args='--spring.profiles.active=hsqldb'

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/vn/jmixapp/menu.xml
jmix.ui.composite-menu=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=vi,en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

# ===== Spring AI: Liquibase owns the schemas (Phase 2) =====
# Chat memory DDL is shipped via the ai-agent add-on's 060-ai-chat-memory.xml changelog.
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
# pgvector DDL is shipped via the ai-agent add-on's 070-ai-kb-vector-store.xml changelog.
spring.ai.vectorstore.pgvector.initialize-schema=false
