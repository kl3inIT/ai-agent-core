# Plan 08-07 — manual-dispatch live-tier suite (TEST-05 golden questions through a real
# OpenRouter model). Not on PR or push — strictly opt-in to avoid burning provider quota.
name: ai-agent live suite

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why is this live run being triggered?'
        required: false
        default: 'manual smoke'

# R-07f: explicit minimal permissions.
permissions:
  contents: read

concurrency:
  group: ai-agent-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v3

      - name: Preflight — OPENROUTER_API_KEY must be set
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "ERROR: OPENROUTER_API_KEY secret is not configured. Set it in repo Settings → Secrets → Actions." >&2
            exit 1
          fi
          echo "OPENROUTER_API_KEY length: ${#OPENROUTER_API_KEY} (redacted)"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # WR-006: provide explicit fallback defaults for the optional secrets so an unset
      # secret does not export an EMPTY env var that would override the
      # test-app.properties defaults with a blank value (Spring placeholder resolution
      # treats empty as "set to empty string", not "fall back to default"). Using `||`
      # keeps the secret value when present and substitutes the documented defaults.
      - name: Run live-tier suite (@Tag('live'))
        run: ./gradlew :ai-agent:ai-agent:liveTest --no-daemon
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'qwen/qwen3-next-80b-a3b-instruct' }}

      - name: Upload live-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-live-reports-${{ github.run_id }}
          path: ai-agent/ai-agent/build/reports/tests/liveTest/
