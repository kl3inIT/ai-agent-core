# Plan 08-07 — PR-blocking CI for the ai-agent add-on.
#
# Runs on every push to main + every PR. We invoke `./gradlew check`, which executes the
# default `test` task (excludes @Tag('live') and @Tag('rag-it')) PLUS — when Docker is
# detected on the runner — the `integrationTest` task wired into `check` by
# ai-agent/ai-agent.gradle. GitHub-hosted ubuntu-latest runners ship with Docker, so the
# Phase-5 pgvector/RAG @Tag('rag-it') integration contracts are gated on every PR.
# @Tag('live') stays opt-in (manual dispatch only — see ai-agent-live.yml).
name: ai-agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# R-07f: explicit minimal permissions; PR-blocking workflow only needs read.
permissions:
  contents: read
  checks: write
  pull-requests: write

# R-07f: cancel superseded runs on the same branch / PR.
concurrency:
  group: ai-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: false

      # WR-002: invoke `check` (not just `test`) so the Docker-gated `integrationTest`
      # task — wired into `check` by ai-agent/ai-agent.gradle when Docker is detected on
      # the runner — runs as part of the PR gate. GitHub ubuntu-latest runners ship with
      # Docker, so the @Tag('rag-it') pgvector/RAG integration suite executes here.
      # Default `test` still runs first via task dependency and excludes @Tag('live') +
      # @Tag('rag-it'); the integration tier is added on top, not in place of, the
      # default tier.
      # -PciParallel forks the test runner across processes (2 by default) — the suite's
      # wall-clock is dominated by serial Jmix context boots, and the clean ubuntu-latest
      # runner (4 vCPU / 16GB, no app) has the RAM headroom that low-RAM dev boxes lack.
      # --build-cache reuses task outputs across runs (compile/enhance) on cache hit.
      - name: Compile + check (default + Docker-gated integration tier)
        run: ./gradlew :ai-agent:ai-agent:check --no-daemon --build-cache -PciParallel

      - name: Publish ai-agent + ai-agent-starter to local maven (for downstream smoke)
        run: ./gradlew :ai-agent:ai-agent:publishToMavenLocal :ai-agent:ai-agent-starter:publishToMavenLocal --no-daemon

      # jmix-insurance pattern: surface JUnit failures as a PR check so reviewers can click
      # straight to the failing test from the GitHub PR check list.
      - name: Publish JUnit test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'ai-agent/ai-agent/build/test-results/test/TEST-*.xml'
          fail_on_failure: true
          require_tests: false

      # Always upload — even on green runs, the HTML + XML reports are useful for flake
      # forensics and CI cache inspection.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-agent-test-reports
          path: |
            ai-agent/ai-agent/build/reports/tests/
            ai-agent/ai-agent/build/test-results/
