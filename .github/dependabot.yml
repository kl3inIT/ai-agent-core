version: 2
updates:
  # Gradle: scan the composite root + both includedBuilds. (jmix-app was dropped;
  # dth-crm is the current demo host.) No npm: the project ships no package.json.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/ai-agent"
      - "/dth-crm"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    labels:
      - "dependencies"
      - "gradle"
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Bangkok"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
